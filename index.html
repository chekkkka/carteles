<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Carteles QR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f4f6f8; padding: 20px; color: #333; }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 20px; text-align: center; color: #1a73e8; }
    .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
    input[type="url"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin-bottom: 10px; }
    button { width: 100%; background: #1a73e8; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    button:active { background: #1557b0; }
    .status { font-size: 12px; font-weight: normal; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Panel de Carteles QR</h1>
    <div id="lista-carteles">Cargando carteles...</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://nfccaba-5e8d5-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const contenedor = document.getElementById('lista-carteles');

    db.ref('carteles').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      contenedor.innerHTML = '';
      
      for (let i = 1; i <= 50; i++) {
        const id = String(i).padStart(3, '0');
        const urlActual = data[id] || '';
        
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span>Cartel #${id}</span>
            <span class="status">${urlActual ? '✅ Asignado' : '⚪ Libre'}</span>
          </div>
          <input type="url" id="input-${id}" value="${urlActual}" placeholder="https://g.page/r/...">
          <button onclick="guardarCartel('${id}')">Guardar Link</button>
        `;
        contenedor.appendChild(card);
      }
    });

    function guardarCartel(id) {
      const url = document.getElementById(`input-${id}`).value;
      db.ref('carteles/' + id).set(url).then(() => {
        alert(`¡Cartel #${id} guardado correctamente!`);
      }).catch((err) => alert('Error: ' + err.message));
    }
  </script>
</body>
</html>
